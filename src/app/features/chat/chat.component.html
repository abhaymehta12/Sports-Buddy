<mat-card class="card">
    <div class="left-side">
        <div *ngFor="let detail of chatList" (click)="openChat(detail)" style="cursor:pointer;">
            <div *ngIf="userData.id === detail.sender_id" class="row">
                <mat-icon class="avatar">
                    <img [src]="detail.receiver_img" />
                </mat-icon>
                <span class="senderName" [title]="detail.receiver">{{ detail.receiver }}</span>
            </div>
            <div *ngIf="userData.id === detail.receiver_id" class="row">
                <mat-icon class="avatar">
                    <img [src]="detail.sender_img" />
                </mat-icon>
                <span class="senderName" [title]="detail.sender">{{ detail.sender }}</span>
                <img class="newAlert" *ngIf="!detail.seen" src="assets/new_image.png" />
            </div>
        </div>
    </div>
    <div class="right-side">
        <div class="msgContainer" *ngIf="selected">
            <div *ngFor="let chat of chatMessages" class="msgBox"
                [ngClass]="chat.sender_id === userData.id ? 'myMessage' : 'othersMessage'">
                {{ chat.message }} <i class="time">{{ chat.format_time}}</i>
            </div>
        </div>
        <mat-icon class="send" (click)="sendChat()">send</mat-icon>
        <input matInput [(ngModel)]="message" placeholder="Message" class="messageInputBox">
    </div>
</mat-card>
