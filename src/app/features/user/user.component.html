<mat-card style="padding-top: 0px;">
    <mat-tab-group>
        <mat-tab label="Events">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
                <ng-container matColumnDef="S. no">
                    <th mat-header-cell *matHeaderCellDef>{{ columnLabels['S. no'] }}</th>
                    <td mat-cell *matCellDef="let element">{{ element['S. no'] }}</td>
                </ng-container>

                <ng-container matColumnDef="sport">
                    <th mat-header-cell *matHeaderCellDef>{{ columnLabels['sport'] }}</th>
                    <td mat-cell *matCellDef="let element">{{ element.sport }}</td>
                </ng-container>

                <ng-container matColumnDef="category">
                    <th mat-header-cell *matHeaderCellDef>{{ columnLabels['category'] }}</th>
                    <td mat-cell *matCellDef="let element">{{ element.category }}</td>
                </ng-container>

                <ng-container matColumnDef="sport_place">
                    <th mat-header-cell *matHeaderCellDef>{{ columnLabels['sport_place'] }}</th>
                    <td mat-cell *matCellDef="let element">{{ element.sport_place }}</td>
                </ng-container>

                <ng-container matColumnDef="location">
                    <th mat-header-cell *matHeaderCellDef>{{ columnLabels['location'] }}</th>
                    <td mat-cell *matCellDef="let element">{{ element.location }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="clickedRows(row)"></tr>
            </table>

            <!-- MatPaginator -->
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of sports data">
            </mat-paginator>
        </mat-tab>
        <mat-tab label="Match Buddy">
            <app-matchbuddy [userData]="userData"></app-matchbuddy>
        </mat-tab>
    </mat-tab-group>
</mat-card>
