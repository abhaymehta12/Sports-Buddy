<mat-card style="padding-top: 0px;">
    <mat-tab-group>
        <mat-tab label="Events">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
                <ng-container matColumnDef="S. no">
                    <th mat-header-cell *matHeaderCellDef> S. No </th>
                    <td mat-cell *matCellDef="let element">{{ element['S. no'] }}</td>
                </ng-container>

                <ng-container matColumnDef="Sport">
                    <th mat-header-cell *matHeaderCellDef> Sport </th>
                    <td mat-cell *matCellDef="let element">{{ element['Sport'] }}</td>
                </ng-container>

                <ng-container matColumnDef="Category">
                    <th mat-header-cell *matHeaderCellDef> Category </th>
                    <td mat-cell *matCellDef="let element">{{ element['Category'] }}</td>
                </ng-container>

                <ng-container matColumnDef="Sport place">
                    <th mat-header-cell *matHeaderCellDef> Sport place </th>
                    <td mat-cell *matCellDef="let element">{{ element['Sport place'] }}</td>
                </ng-container>

                <ng-container matColumnDef="Location">
                    <th mat-header-cell *matHeaderCellDef> Location </th>
                    <td mat-cell *matCellDef="let element">{{ element['Location'] }}</td>
                </ng-container>

                <ng-container matColumnDef="User">
                    <th mat-header-cell *matHeaderCellDef> User </th>
                    <td mat-cell *matCellDef="let element">{{ element['User'] }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="clickedRows(row)"></tr>
            </table>

            <!-- MatPaginator -->
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of sports data">
            </mat-paginator>
        </mat-tab>
        <mat-tab label="Match Buddy">
            <div class="secondTab">
                <span>
                    <mat-label>Sports</mat-label>
                    <mat-select [(value)]="selected" multiple>
                        <mat-option value="Football">Football</mat-option>
                        <mat-option value="Badminton">Badminton</mat-option>
                        <mat-option value="Table Tennis">Table Tennis</mat-option>
                        <mat-option value="Lawn Tennis">Lawn Tennis</mat-option>
                        <mat-option value="Cricket">Cricket</mat-option>
                        <mat-option value="Volley Ball">Volley Ball</mat-option>
                    </mat-select>
                </span>
                <span class="sliderWrap">
                    <mat-label style="padding-left: 9px;">Self-Rating: {{ sliderValue }}</mat-label>
                    <mat-slider min="1" max="10" step="0.5" [(ngModel)]="sliderValue">
                    </mat-slider>
                </span>
            </div>
        </mat-tab>
    </mat-tab-group>
</mat-card>
